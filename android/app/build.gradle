plugins {
    id 'com.android.application'
}

// A private launcher icon can be dropped into app/local-icon/res (git-ignored)
// as mipmap ic_launcher_local; without it the bundled vector icon is used.
// -PpublicIcon ignores it, for builds meant for other people.
def localIcon = file('local-icon/res').exists() &&
        !project.hasProperty('publicIcon')

// Release signing reads android/keystore.properties (git-ignored):
// storeFile, storePassword, keyAlias, keyPassword. Without it the release
// build type is left unsigned.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystore.load(it) }
}

// The native game is built separately with CMake + the NDK
// (see android/build-native.sh); Gradle only packages libmain.so.
android {
    namespace = "org.rageracer.quest"
    compileSdkVersion 36
    defaultConfig {
        applicationId "org.rageracer.quest"
        minSdkVersion 32
        targetSdkVersion 32
        versionCode 97
        versionName "0.6.5-rc1"
        manifestPlaceholders = [
            appIcon: localIcon ? "@mipmap/ic_launcher_local"
                               : "@mipmap/ic_launcher"
        ]
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'jniLibs'
        if (localIcon) {
            res.srcDirs += 'local-icon/res'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    // Khronos OpenXR loader (libopenxr_loader.so), dlopen'ed by SDL_GPU.
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.65'
}
